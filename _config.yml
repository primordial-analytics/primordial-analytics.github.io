# Site settings
name: Primordial Analytics
title: Primordial Analytics
tagline: "Free volunteer data science for community health non-profits"
email: contact@primordialanalytics.com
description: "Free volunteer data science for non-profit community health organizations, from a small Portland, Oregon team. We still work with our longtime clients too."
author:
  name: Primordial Analytics
  type: Organization
  url: https://www.primordialanalytics.com
logo: /img/brand/brand_black.png
lang: en
baseurl: ""
url: https://www.primordialanalytics.com
permalink: pretty
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# add collections
collections:
  team:
    output: false
  testimonials:
    output: false
  casestudies:
    output: true
  posts:
    output: true
    permalink: /blog/:title/

# front matter defaults
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /img/sm_content/og-default.jpg
        width: 1200
        height: 630
        alt: "Primordial Analytics: free volunteer data science for community health non-profits"
  # published for Search Console verification, but kept out of the sitemap
  - scope:
      path: "google1d583c199f5983dc.html"
    values:
      sitemap: false

# add other dirs
includes:
  - favicons
  - fonts
  - img
  - js

# exclude other dirs
exclude:
  - node_modules
  - vendor
  - gulpfile.js
  - gulpfile_example.js
  - README.md
  - CLAUDE.md
  - CHANGELOG.md
  - SECURITY.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - scss
  - svg
  - .idea
  - ruby-build

# Social profiles (jekyll-seo-tag emits these as sameAs on the home page)
social:
  name: Primordial Analytics
  links:
    - https://linkedin.com/company/primordial-analytics/
