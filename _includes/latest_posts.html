<!-- Latest Posts -->
<section id="latest-posts" class="py-5">
    <div class="container py-5">
        <div class="row mb-5 text-center">
            <div class="col-lg-8 offset-lg-2">
                <h2 class="display-5 fw-bold mb-3">From the Blog</h2>
                <p class="lead text-muted fs-4">What we're reading, building, and worrying about lately.</p>
            </div>
        </div>
        <div class="row g-4">
            {% for post in site.posts limit: 3 %}
            <div class="col-md-4">
                <a href="{{ post.url | prepend: site.baseurl }}" class="text-decoration-none">
                    <div class="card h-100 border-0 shadow-sm rounded-4 bg-light transition-hover">
                        <div class="card-body p-4">
                            <p class="text-primary small fw-semibold text-uppercase mb-2"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time></p>
                            <h3 class="card-title fw-bold fs-5 mb-3 text-dark">{{ post.title }}</h3>
                            <p class="text-muted mb-0">{{ post.description }}</p>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
        <div class="text-center mt-5">
            <a href="{{ site.baseurl }}/blog/" class="btn btn-outline-primary btn-sm rounded-pill fw-bold px-4 py-2 transition-hover">More on the blog &rarr;</a>
        </div>
    </div>
</section>
