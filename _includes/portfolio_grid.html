<!-- Portfolio Grid -->
<section class="bg-light py-5" id="portfolio">
    <div class="container py-5">
        <div class="row mb-5">
            <div class="col-lg-8 mx-auto text-center">
                <p class="text-muted fs-5 lh-lg mb-3">These were paid commercial engagements, from before we turned to volunteer work for community health organizations in 2024.</p>
                <p class="text-muted fs-5 lh-lg mb-0">Looking for our volunteer work instead? <a href="{{ site.baseurl }}/community-health-data-help/">Ask for free data help</a>.</p>
            </div>
        </div>
        <div class="row g-4">
            {% for casestudy in site.casestudies %}
            <div class="col-md-4 col-sm-6">
                <a href="{{ casestudy.url | relative_url }}" class="text-decoration-none">
                    <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden transition-hover">
                        <div class="ratio ratio-4x3">
                            <img class="object-fit-cover w-100 h-100" src="{{ site.baseurl }}/img/case_studies/{{ casestudy.thumbnail }}" width="400" height="300" loading="lazy" alt="">
                        </div>
                        <div class="card-body p-4 bg-white text-center">
                            <h2 class="card-title h5 fw-bold text-dark mb-2">{{ casestudy.title }}</h2>
                            <p class="card-text text-muted fs-6 mb-0">{{ casestudy.subtitle }}</p>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
