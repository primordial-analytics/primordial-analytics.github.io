<!-- Header -->
<header class="hero position-relative vh-100 overflow-hidden">
    <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50 z-1"></div>
    <video playsinline="playsinline" muted="muted" loop="loop" poster="/img/galaxy-poster.webp" preload="none" class="hero-video position-absolute top-50 start-50 min-vw-100 min-vh-100 translate-middle object-fit-cover z-0">
        <source data-src="/img/galaxy.webm" type="video/webm">
        <source data-src="/img/galaxy.mp4" type="video/mp4">
    </video>
    <div class="container h-100 position-relative z-2">
        <div class="d-flex align-items-center justify-content-center h-100 text-center">
            <div class="text-white col-lg-10">
                <h1 class="display-4 fw-bold mb-4 text-shadow">Free data help for community health organizations</h1>
                <p class="fs-4 fw-light text-white mb-5 text-shadow">Free, principal-led data science for community health organizations, from Portland, Oregon. Bring us a single chart, a spreadsheet check, or a short call. We usually reply within a few business days.</p>
                <a href="/community-health-data-help/" class="btn btn-primary btn-lg px-5 py-3 text-uppercase fw-bold rounded-pill shadow-lg mt-3 text-dark">Ask for free data help</a>
                <a href="/#contact" class="btn btn-outline-light btn-lg px-5 py-3 text-uppercase fw-bold rounded-pill mt-3 ms-sm-2">Contact us</a>
            </div>
        </div>
    </div>
    <button type="button" class="hero-video-toggle btn btn-sm btn-outline-light position-absolute bottom-0 end-0 m-3 z-2 d-none" aria-label="Pause background video">Pause</button>
</header>
